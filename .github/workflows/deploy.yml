name: Deploy ReviewIntels

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test 2>/dev/null || echo "No tests configured"
      
      - name: Build
        run: npm run build 2>/dev/null || echo "No build script"
      
      - name: Deploy to Railway (if token available)
        if: secrets.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway login --token ${{ secrets.RAILWAY_TOKEN }}
          railway deploy --service reviewintels
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      
      - name: Deploy to Vercel (if token available)
        if: secrets.VERCEL_TOKEN != '' && secrets.RAILWAY_TOKEN == ''
        run: |
          npm install -g vercel
          vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      
      - name: Deploy to Fly.io (if token available)
        if: secrets.FLY_API_TOKEN != '' && secrets.RAILWAY_TOKEN == '' && secrets.VERCEL_TOKEN == ''
        run: |
          curl -L https://fly.io/install.sh | sh
          flyctl deploy --token ${{ secrets.FLY_API_TOKEN }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      
      - name: Verify deployment
        run: |
          echo "Deployment workflow completed"
          echo "Check GitHub Secrets to add RAILWAY_TOKEN, VERCEL_TOKEN, or FLY_API_TOKEN"
