app = "reviewintel-prod"
primary_region = "pdx"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  PORT = "3000"
  NODE_ENV = "production"

[[services]]
  protocol = "tcp"
  internal_port = 3000
  processes = ["app"]

  [[services.ports]]
    number = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    number = 443
    handlers = ["tls", "http"]

[checks]
  [checks.status]
    enabled = true
    type = "http"
    interval = "10s"
    timeout = "5s"
    path = "/health"
