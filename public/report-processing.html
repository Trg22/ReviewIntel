<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generating Your Report - ReviewIntels</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #3366cc 0%, #2952a3 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      padding: 60px 40px;
      text-align: center;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #3366cc;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 40px;
      font-size: 14px;
      line-height: 1.6;
    }

    .spinner {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 4px solid #e0e0e0;
      border-top: 4px solid #3366cc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px 0;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .message {
      color: #666;
      font-size: 14px;
      margin-top: 20px;
    }

    .error-message {
      color: #d32f2f;
      background: #ffebee;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      display: none;
    }

    .success-message {
      color: #388e3c;
      background: #e8f5e9;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      display: none;
    }

    button {
      background: #3366cc;
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
      display: none;
    }

    button:hover {
      background: #2952a3;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Reviewintels</div>
    <h1>Generating Your Report</h1>
    <p class="subtitle">Your report is being prepared. This typically takes 30-60 seconds.</p>
    
    <div class="spinner"></div>
    
    <p class="message">Please don't close this window...</p>
    
    <div class="error-message" id="errorMessage"></div>
    <div class="success-message" id="successMessage" style="display: none;">
      Report ready! Redirecting to your dashboard...
    </div>
    
    <button id="retryBtn" onclick="location.href = '/app.html'">Return to Checkout</button>
  </div>

  <script>
    // Get parameters from URL
    const urlParams = new URLSearchParams(window.location.search);
    const asin = urlParams.get('asin');
    const tier = urlParams.get('tier');
    
    // Get email from sessionStorage (stored by app.html before Stripe redirect)
    const pendingReport = sessionStorage.getItem('pendingReport');
    let email = '';
    
    if (pendingReport) {
      try {
        const data = JSON.parse(pendingReport);
        email = data.email;
      } catch (e) {
        console.error('Could not parse pending report:', e);
      }
    }

    if (!asin || !tier || !email) {
      showError('Invalid session. Missing required information (ASIN, tier, or email). Please start over and try again.');
    } else {
      // Generate the report immediately (not polling for nonexistent endpoint)
      generateReportNow();
    }

    async function generateReportNow() {
      try {
        console.log('🚀 Generating report for:', { asin, tier, email });
        
        // Wait a few seconds first - the webhook may be processing in the background
        console.log('⏳ Waiting for webhook to process...');
        await new Promise(resolve => setTimeout(resolve, 3000));
        
        const response = await fetch('/api/generate-report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            asin: asin,
            tier: tier,
            email: email
          })
        });

        console.log('📊 Response status:', response.status, response.ok);
        const data = await response.json();
        console.log('📊 Report generation response:', data);
        
        if (response.ok && data.success && data.report) {
          // Report generated successfully!
          console.log('✅ Report generated:', data.report.reportId);
          document.getElementById('successMessage').style.display = 'block';
          document.querySelector('.spinner').style.display = 'none';
          document.querySelector('.message').style.display = 'none';
          
          // Clear session data and redirect to dashboard
          sessionStorage.removeItem('pendingReport');
          localStorage.removeItem('stripeSessionId');
          
          // Redirect to dashboard after 2 seconds
          setTimeout(() => {
            window.location.href = `/dashboard.html?email=${encodeURIComponent(email)}`;
          }, 2000);
        } else {
          // Show the actual error from backend
          const errorMsg = data.error || data.details || data.message || 'Failed to generate report. Please try again.';
          showError(errorMsg);
        }
      } catch (error) {
        console.error('❌ Report generation error:', error);
        showError('An error occurred while generating your report: ' + error.message + '. Please try again.');
      }
    }

    function showError(message) {
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorMessage').style.display = 'block';
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('.message').style.display = 'none';
      document.getElementById('retryBtn').style.display = 'block';
      console.error('❌ Error:', message);
    }
  </script>
</body>
</html>
